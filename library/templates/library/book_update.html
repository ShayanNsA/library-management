
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Update Book</title>
</head>

<body>

    <h1>ویرایش کتاب</h1>

    <h2>{{ book.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            ذخیره تغییرات
        </button>

    </form>

    <br>

    <a href="{% url 'book-detail' book.id %}">
        بازگشت به کتاب
    </a>

</body>
